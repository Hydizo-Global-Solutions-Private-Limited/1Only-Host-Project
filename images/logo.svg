<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <!-- Solar amber to coral gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700; stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF9E00; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF007F; stop-opacity:1" />
    </linearGradient>
    
    <!-- Deep space neon glow gradient -->
    <linearGradient id="flareGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF007F; stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#8338EC; stop-opacity:0.85" />
    </linearGradient>
    
    <!-- Neon blur glow filter -->
    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-counter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 1px #FF9E00); }
      50% { opacity: 1; filter: drop-shadow(0 0 3px #FF007F); }
    }
    .orbit-outer {
      transform-origin: 30px 30px;
      animation: spin-clockwise 25s infinite linear;
    }
    .orbit-inner {
      transform-origin: 30px 30px;
      animation: spin-counter 18s infinite linear;
    }
    .glow-core {
      animation: pulse-glow 5s infinite ease-in-out;
    }
  </style>

  <!-- Left Side: Sol-1 Corona Icon (Centered at 30,30 and scaled down to r=25 max to prevent clipping) -->
  <g transform="translate(5, 0)">
    <!-- Ambient outer orbits -->
    <circle class="orbit-outer" cx="30" cy="30" r="25" fill="none" stroke="url(#flareGrad)" stroke-width="1.2" stroke-dasharray="3, 5" opacity="0.6" />
    <circle class="orbit-inner" cx="30" cy="30" r="21" fill="none" stroke="url(#solarGrad)" stroke-width="1.5" stroke-dasharray="6, 3" stroke-linecap="round" opacity="0.8" />
    <circle cx="30" cy="30" r="16" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="2, 2" opacity="0.6" />
    
    <!-- Main Sun Corona (Glowing Flares) -->
    <g class="glow-core" filter="url(#solarGlow)">
      <!-- Sun rays radiating outwards -->
      <path d="M30 7 L30 11 M30 49 L30 53 M7 30 L11 30 M49 30 L53 30 M13.7 13.7 L16.5 16.5 M43.5 43.5 L46.3 46.3 M13.7 46.3 L16.5 43.5 M43.5 13.7 L46.3 16.5" 
            stroke="url(#solarGrad)" stroke-width="2.2" stroke-linecap="round" />
      
      <!-- Central core "1" symbol representing the One Ruler Sun -->
      <path d="M26 21 L31 16 L31 41 M25 41 L37 41" 
            fill="none" stroke="url(#solarGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Right Side: Typography (Outfit styling via CSS) -->
  <g transform="translate(72, 0)">
    <!-- "1Only" brand name in Gold Gradient -->
    <text x="0" y="36" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="url(#solarGrad)" letter-spacing="-0.5">1Only</text>
    
    <!-- "Host" brand name in high-contrast clean white -->
    <text x="84" y="36" font-family="'Outfit', sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" letter-spacing="-0.5">Host</text>
    
    <!-- Modern space-grade subtext -->
    <text x="1" y="49" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#8338EC" letter-spacing="4.2" opacity="0.9">HELIOCENTRIC CLOUD</text>
  </g>
</svg>
